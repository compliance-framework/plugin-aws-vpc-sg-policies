name: ci

on:
  pull_request:
    # closed: notify marks the PR's needs-human card handled and closes its CI incident.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-policies.yml@eacc8f6a26bd7a98c72fbaf586a7b0687dee6eb0 # v1.8.0
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@eacc8f6a26bd7a98c72fbaf586a7b0687dee6eb0 # v1.8.0
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@eacc8f6a26bd7a98c72fbaf586a7b0687dee6eb0 # v1.8.0
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
